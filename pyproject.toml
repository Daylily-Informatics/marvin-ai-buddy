[project]
name = "marvin-ai-buddy"
version = "0.1.0"
description = "Reference implementation scaffolding for the Marvin multimodal assistant"
authors = [{name = "Marvin Team"}]
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31.0",
  "boto3>=1.28.0",
]

[project.scripts]
marvin-cli = "client.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["broker", "client", "monitor", "identity"]